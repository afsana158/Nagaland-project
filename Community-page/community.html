<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nagaland Community</title>
    <link rel="stylesheet" href="community.css" />
  </head>

  <body>
    <div class="page-container">
      <nav>
        <h2 class="main-title">
          <a href="index.html" class="home-link"
            ><span class="green">Nagaland</span
            ><span class="white">Community</span></a
          >
        </h2>
        <div class="nav-actions">
          <button id="themeToggle">🌙</button>

          <div class="notif-wrapper">
            <button id="notifBtn" class="notif-icon">
              🔔
              <span id="notifCount" class="notif-count">0</span>
            </button>

            <div id="notifDropdown" class="notif-dropdown hidden">
              <h4>Notifications</h4>
              <div id="notifList"></div>
            </div>
          </div>

          <div class="profile-menu">
            <button id="loginBtn" class="profile-icon">👤</button>

            <div id="dropdown" class="dropdown hidden">
              <p id="userName">Guest</p>
              <button id="logoutBtn">Logout</button>
            </div>
          </div>
        </div>
      </nav>

      <div id="loginModal" class="modal">
        <div class="modal-box">
          <span class="close-btn" id="closeModal">✖</span>

          <h3>Welcome to the Community</h3>
          <p>Please login to continue</p>

          <button id="googleLogin">Login with Google</button>
        </div>
      </div>

      <main>
        <div class="layout">
          <aside class="sidebar">
            <h3>Community Panel</h3>

            <p>🔥 Trending</p>

            <ul>
              <li>#Culture</li>
              <li>#Tourism</li>
              <li>#Festivals</li>
              <li>#Food</li>
            </ul>
          </aside>

          <section class="feed-section">
            <div class="create-post">
              <h3>Create a Post</h3>

              <input id="title" placeholder="Post title" />

              <textarea id="body" placeholder="Write something..."></textarea>

              <input type="file" id="image" />

              <img id="preview" class="hidden" />

              <button id="postBtn">Post</button>
            </div>

            <div class="sort-bar">
              <button onclick="setSort('new')">🕒 New</button>
              <button onclick="setSort('top')">🔥 Top</button>
            </div>

            <div id="feed"></div>
          </section>
        </div>
      </main>

      <div id="toast" class="toast hidden"></div>

      <footer>© 2026 Nagaland Community | Built for Project</footer>
    </div>

    <script type="module" src="community.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagaland Travel Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --forest:   #1e3a2f;
            --forest-2: #2b5240;
            --sage:     #4a7c5f;
            --cream:    #f5f0e8;
            --parchment:#ece5d4;
            --terra:    #c46a35;
            --terra-lt: #e8905e;
            --gold:     #d4a24a;
            --charcoal: #2c2825;
            --muted:    #7a6f63;
            --white:    #fff;
            --radius:   14px;
        }

        html, body {
            height: 100%;
            font-family: 'DM Sans', sans-serif;
            background: var(--forest);
            color: var(--charcoal);
        }

        /* ── TRIBAL PATTERN BACKGROUND ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 24px,
                    rgba(255,255,255,0.025) 24px,
                    rgba(255,255,255,0.025) 25px
                ),
                repeating-linear-gradient(
                    -45deg,
                    transparent,
                    transparent 24px,
                    rgba(255,255,255,0.025) 24px,
                    rgba(255,255,255,0.025) 25px
                );
            pointer-events: none;
            z-index: 0;
        }

        /* ── LAYOUT ── */
        .shell {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            width: 100%;
            max-width: 720px;
            height: min(90vh, 840px);
            background: var(--cream);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 32px 80px rgba(0,0,0,0.45);
        }

        /* ── HEADER ── */
        .header {
            background: var(--forest-2);
            padding: 1.25rem 1.75rem;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--terra), var(--gold), var(--terra));
        }

        .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--terra);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .header-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--cream);
            letter-spacing: 0.01em;
        }

        .header-text p {
            font-size: 0.72rem;
            color: var(--sage);
            font-weight: 300;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 1px;
        }

        .status-dot {
            margin-left: auto;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 0 3px rgba(74,222,128,0.25);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(74,222,128,0.25); }
            50%       { box-shadow: 0 0 0 6px rgba(74,222,128,0.1); }
        }

        /* ── CHAT AREA ── */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--parchment); border-radius: 99px; }

        /* ── MESSAGES ── */
        .msg {
            display: flex;
            gap: 10px;
            animation: rise 0.25s ease-out both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-top: 2px;
        }

        .msg.bot .avatar {
            background: var(--forest-2);
            font-size: 16px;
        }

        .msg.user .avatar {
            background: var(--terra);
            color: var(--white);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .bubble {
            max-width: 78%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            line-height: 1.65;
            font-weight: 400;
        }

        .msg.bot .bubble {
            background: var(--white);
            color: var(--charcoal);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0,0,0,0.06);
        }

        .msg.user .bubble {
            background: var(--forest-2);
            color: var(--cream);
            border-bottom-right-radius: 4px;
        }

        /* ── TYPING INDICATOR ── */
        .typing-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            height: 18px;
            padding: 2px 0;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: blink 1.2s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.25; transform: scale(0.9); }
            40%            { opacity: 1;    transform: scale(1); }
        }

        /* ── SUGGESTIONS ── */
        .suggestions {
            padding: 0 1.75rem 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }

        .suggestions span {
            background: var(--parchment);
            border: 1px solid rgba(0,0,0,0.08);
            color: var(--muted);
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 99px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            font-family: 'DM Sans', sans-serif;
            white-space: nowrap;
        }

        .suggestions span:hover {
            background: var(--terra);
            color: var(--white);
            border-color: var(--terra);
        }

        /* ── INPUT BAR ── */
        .input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 1rem 1.25rem;
            background: var(--parchment);
            border-top: 1px solid rgba(0,0,0,0.07);
            flex-shrink: 0;
        }

        #user-input {
            flex: 1;
            background: var(--white);
            border: 1.5px solid transparent;
            border-radius: 99px;
            padding: 0.6rem 1.1rem;
            font-size: 0.875rem;
            font-family: 'DM Sans', sans-serif;
            color: var(--charcoal);
            outline: none;
            transition: border-color 0.2s;
        }

        #user-input::placeholder { color: #bbb; }

        #user-input:focus {
            border-color: var(--sage);
        }

        #send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--terra);
            color: var(--white);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
        }

        #send-btn:hover  { background: var(--terra-lt); }
        #send-btn:active { transform: scale(0.92); }
        #send-btn:disabled { background: var(--parchment); color: var(--muted); cursor: default; }

        /* ── ERROR MSG ── */
        .error-bubble {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }

        /* ── WELCOME ── */
        .welcome {
            text-align: center;
            padding: 2.5rem 1rem 1rem;
            color: var(--muted);
            font-size: 0.82rem;
            line-height: 1.7;
            flex-shrink: 0;
        }

        .welcome-icon { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }

        .welcome h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--charcoal);
            margin-bottom: 0.35rem;
        }
    </style>
</head>
<body>
<div class="shell">
    <div class="card">

        <!-- HEADER -->
        <header class="header">
            <div class="header-icon">🌄</div>
            <div class="header-text">
                <h1>Nagaland Travel Assistant</h1>
                <p>Powered by local knowledge &amp; AI</p>
            </div>
            <div class="status-dot" title="Online"></div>
        </header>

        <!-- CHAT MESSAGES -->
        <div class="chat-box" id="chat-box">
            <div class="welcome" id="welcome-screen">
                <span class="welcome-icon">🏔️</span>
                <h2>Plan your Nagaland adventure</h2>
                <p>Ask me about places to visit, local food,<br>hotels, transport, or get a full itinerary.</p>
            </div>
        </div>

        <!-- QUICK SUGGESTIONS -->
        <div class="suggestions" id="suggestions">
            <span onclick="quickSend('Top places to visit')">📍 Top places</span>
            <span onclick="quickSend('Best food to try')">🍜 Local food</span>
            <span onclick="quickSend('Recommended hotels')">🏨 Hotels</span>
            <span onclick="quickSend('Give me a 3-day itinerary')">🗺️ Itinerary</span>
            <span onclick="quickSend('How to reach Nagaland')">🚗 Transport</span>
        </div>

        <!-- INPUT BAR -->
        <div class="input-bar">
            <input
                type="text"
                id="user-input"
                placeholder="Ask anything about Nagaland…"
                autocomplete="off"
                autofocus
            />
            <button id="send-btn" onclick="sendMessage()" aria-label="Send">&#10148;</button>
        </div>

    </div>
</div>

<script>
    const chatBox   = document.getElementById('chat-box');
    const input     = document.getElementById('user-input');
    const sendBtn   = document.getElementById('send-btn');
    const welcomeEl = document.getElementById('welcome-screen');
    const suggestions = document.getElementById('suggestions');
    let   isWaiting = false;

    function escapeHTML(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function formatResponse(text) {
        return escapeHTML(text).replace(/\n/g, '<br>');
    }

    function appendMsg(role, content, isTyping = false) {
        if (welcomeEl) welcomeEl.remove();
        suggestions.style.display = 'none';

        const wrap   = document.createElement('div');
        wrap.classList.add('msg', role);

        const avatar = document.createElement('div');
        avatar.classList.add('avatar');
        avatar.textContent = role === 'bot' ? '🧭' : 'YOU';

        const bubble = document.createElement('div');
        bubble.classList.add('bubble');
        if (role === 'bot' && isTyping) {
            bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
            bubble.dataset.typing = 'true';
        } else if (role === 'bot') {
            bubble.innerHTML = formatResponse(content);
        } else {
            bubble.textContent = content;
        }

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        chatBox.appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
        return bubble;
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text || isWaiting) return;

        isWaiting = true;
        sendBtn.disabled = true;
        input.value = '';

        appendMsg('user', text);
        const botBubble = appendMsg('bot', '', true);

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            if (!res.ok) throw new Error(`Server error ${res.status}`);

            const data = await res.json();
            botBubble.innerHTML = formatResponse(data.response || 'No response received.');

        } catch (err) {
            botBubble.classList.add('error-bubble');
            botBubble.innerHTML = '⚠️ Could not reach the server. Please check the backend is running.';
            console.error(err);
        }

        isWaiting = false;
        sendBtn.disabled = false;
        input.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function quickSend(text) {
        input.value = text;
        sendMessage();
    }

    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
